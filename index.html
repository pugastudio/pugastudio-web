<section class="vista" id="v-explorar" aria-label="Explorar" hidden>
  <div class="explorar-fondo" id="explorar-fondo"></div>
  <div class="explorar-centro">
    <label for="buscar" style="position:absolute;left:-9999px">Buscar</label>
    <input id="buscar" type="text" autocomplete="off" placeholder="Escribe un término (ej. Diseño)">
    <div class="sub">Explora Puga Studio</div>
    <div class="resultados" id="resultados"></div>
  </div>
</section>

<!-- PROYECTOS -->
<section class="vista" id="v-proyectos" aria-label="Proyectos" hidden>
  <div class="campo" id="campo-proyectos"><div class="lienzo"></div></div>
  <div class="indice" id="indice-proyectos" hidden>
    <div class="nums" role="group" aria-label="Disciplinas">
      <button type="button" class="todo" data-d="0" aria-pressed="true">Todo</button>
      <button type="button" data-d="1" aria-pressed="false" title="Sólidos">01</button>
      <button type="button" data-d="2" aria-pressed="false" title="Lo Interior">02</button>
      <button type="button" data-d="3" aria-pressed="false" title="Montañismo">03</button>
      <button type="button" data-d="4" aria-pressed="false" title="Taller de Sombras">04</button>
      <button type="button" data-d="5" aria-pressed="false" title="Circular">05</button>
    </div>
    <p class="nums-nombre" id="nums-nombre" aria-live="polite">Todas las disciplinas</p>
    <ul id="lista-proyectos"></ul>
  </div>
  <div class="flotante izq"><button type="button" class="cuadro" data-indice="indice-proyectos" aria-label="Abrir índice">+</button><button type="button" data-indice="indice-proyectos">Índice de proyectos</button></div>
  <div class="flotante der"><button type="button" class="cuadro" data-zoom="1" aria-label="Acercar">+</button><button type="button" class="cuadro" data-zoom="-1" aria-label="Alejar">−</button></div>
</section>

<!-- CIRCULAR -->
<section class="vista" id="v-circular" aria-label="Circular" hidden>
  <div class="campo" id="campo-circular"><div class="lienzo"></div></div>
  <div class="proximamente" aria-live="polite"><p>Próximamente</p></div>
  <div class="indice" id="indice-circular" hidden><ul id="lista-circular"></ul></div>
  <div class="flotante izq"><button type="button" class="cuadro" data-indice="indice-circular" aria-label="Abrir índice">+</button><button type="button" data-indice="indice-circular">Índice Circular</button></div>
  <div class="flotante der"><button type="button" class="cuadro" data-zoom="1" aria-label="Acercar">+</button><button type="button" class="cuadro" data-zoom="-1" aria-label="Alejar">−</button></div>
</section>

<!-- PUBLICACIONES -->
<section class="vista" id="v-publicaciones" aria-label="Publicaciones" hidden>
  <div class="campo" id="campo-publicaciones"><div class="lienzo"></div></div>
  <div class="indice" id="indice-publicaciones" hidden><ul id="lista-publicaciones"></ul></div>
  <div class="flotante izq"><button type="button" class="cuadro" data-indice="indice-publicaciones" aria-label="Abrir índice">+</button><button type="button" data-indice="indice-publicaciones">Índice de publicaciones</button></div>
  <div class="flotante der"><button type="button" class="cuadro" data-zoom="1" aria-label="Acercar">+</button><button type="button" class="cuadro" data-zoom="-1" aria-label="Alejar">−</button></div>
</section>

<!-- CONTACTO -->
<section class="vista scroll-y" id="v-contacto" aria-label="Contacto" hidden></section>
</main>

<template id="tpl-contacto">
  <div class="contacto">
    <div class="firma">
      <div class="firma-logo">
        <div class="logo-gigante"><img src="img/logo-negro.png" alt="Puga Studio"></div>
        <div class="pegaso"></div>
      </div>
      <p class="firma-frase"></p>
    </div>
    <div class="contacto-cuerpo">
      <div class="datos">
        <div class="regla datos-contacto"></div>
        <form class="form-suscribe">
          <label>Suscríbete a nuestro newsletter:</label>
          <div class="suscribe"><input type="email" name="correo" placeholder="Correo electrónico" aria-label="Correo electrónico" required><button type="submit">Suscribirme</button></div>
          <p class="msg" aria-live="polite" style="margin-top:8px"></p>
        </form>
        <div class="regla"><p class="texto-contacto"></p></div>
        <div class="creditos">
          <p>Diseño: Puga Studio</p>
          <p>Puga Studio © <span class="anio"></span></p>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- RECORRIDO HORIZONTAL (proyecto, texto, origen) -->
<div class="recorrido" id="recorrido" aria-hidden="true">
  <div class="r-barra">
    <div class="r-progreso" id="r-progreso"></div>
    <button type="button" class="volver" id="r-volver">Volver al inicio</button>
    <span class="titulo" id="r-titulo"></span>
    <button type="button" class="cerrar" id="r-cerrar">Cerrar</button>
  </div>
  <div class="pista" id="pista"></div>
  <div class="flotante izq" id="r-indice" style="bottom:16px"><button type="button" class="cuadro" aria-label="Índice de proyectos">+</button><button type="button">Índice de proyectos</button></div>
</div>

<div class="etiqueta" id="etiqueta" aria-hidden="true"><span class="ico"><s></s></span><span class="txt" id="etiqueta-txt"></span></div>

<script src="contenido.js?v=202611030200"></script>
<script src="sitio.js?v=202611030200"></script>
</body>
</html>
